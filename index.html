<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>DJCIOKOSTUDIO - ON AIR</title>
<style>
:root{--bg:#071018;--panel:#0d1822;--blue:#7ecbff;--blue2:#b9e4ff;--red:#c1392b;--text:#eaf6ff;--muted:#9bb6c9;--line:#1c3344}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Georgia,serif}
button,input{font-family:inherit}
.app{max-width:430px;margin:0 auto;min-height:100%;background:linear-gradient(#0b1a24,#071018);display:flex;flex-direction:column;justify-content:space-between;padding-bottom:20px}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)}
.logo{letter-spacing:.16em;font-size:13px;color:var(--blue2);font-weight:bold}
.live-badge{background:#c1392b;color:#fff;font-size:10px;padding:4px 10px;border-radius:20px;font-weight:bold;letter-spacing:.1em;display:none}
.live-badge.active{display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.5}100%{opacity:1}}
.main-content{padding:10px;flex:1;display:flex;flex-direction:column}
h1{font-size:18px;font-weight:500;color:var(--blue2);margin-bottom:4px;text-align:center}
.muted{color:var(--muted);font-size:12px;text-align:center;margin-bottom:10px}
.studio{position:relative;width:100%;aspect-ratio:9/16;max-height:55vh;background:#000;border-radius:14px;overflow:hidden;border:1px solid #2a5570;touch-action:none;margin:0 auto}
.studio canvas,.studio video.raw{width:100%;height:100%;object-fit:cover}
.studio video.raw{position:absolute;opacity:0;pointer-events:none}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid #5aa0d0;background:linear-gradient(#3a7eb0,#1d4e73);color:#eaf6ff;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:11px}
.btn.primary{background:linear-gradient(#4aa0d8,#21608f)}
.btn.on{outline:2px solid #7ecbff;border-color:#b9e4ff}
.rec-row{display:flex;justify-content:center;margin-top:10px}
.rec-btn{width:56px;height:56px;border-radius:50%;border:4px solid #fff;background:#c1392b;cursor:pointer}
.rec-btn.rec{background:#fff;border-color:#c1392b;border-radius:14px;width:34px;height:34px}
.field{margin:8px 0}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.field input{width:100%;background:#071018;border:1px solid #2a5570;color:var(--text);padding:8px;border-radius:8px;font-size:12px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#123044;color:#b9e4ff;padding:8px 14px;border-radius:20px;font-size:12px;display:none;z-index:9;border:1px solid #7ecbff}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="logo">DJCIOKOSTUDIO</div>
  <span class="live-badge" id="topLiveBadge">ON AIR LIVE</span>
</header>

<div class="main-content">
  <h1>STUDIO VDO NINJA & MUSIC BG</h1>
  <p class="muted">Alege fundalul muzical, activează camera și transmite live</p>

  <div class="studio" id="stageBox">
    <video id="cam" class="raw" autoplay playsinline muted></video>
    <video id="bgVideoElem" class="raw" playsinline loop muted style="display:none;"></video>
    <canvas id="stage"></canvas>
  </div>

  <div class="rec-row">
    <button class="rec-btn" id="recBtn" title="Pornire/Oprire Transmisie ON AIR"></button>
  </div>
  
  <div class="tools" id="tools">
    <button class="btn on" id="btnMic">🎙 Audio ON</button>
    <button class="btn on" id="btnVideoToggle">📹 Video ON</button>
    <button class="btn" id="btnAiCut">✂️ AI Cut OFF</button>
    <button class="btn" id="btnMusicBg1">🎵 Fundal Club</button>
    <button class="btn" id="btnMusicBg2">🎧 Fundal DJ Neon</button>
    <button class="btn" id="btnMusicBg3">🎸 Fundal Party Strobe</button>
    <button class="btn" id="btnUploadBg">📁 Upload Foto</button>
    <button class="btn" id="btnUploadBgVideo">🎥 Upload Video</button>
    <button class="btn" id="btnUploadMask">🎭 Mască PNG</button>
    <button class="btn" id="btnScaleToggle">📐 Scalare: Cover</button>
  </div>

  <div class="field">
    <label>Logo pe ecran / Brand</label>
    <input id="logoText" maxlength="28" placeholder="DJCIOKOSTUDIO"/>
  </div>
</div>

<input type="file" id="fileBg" accept="image/*" hidden/>
<input type="file" id="fileBgVideo" accept="video/*" hidden/>
<input type="file" id="fileMask" accept="image/*" hidden/>
<div class="toast" id="toast"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>

<script>
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

document.addEventListener('DOMContentLoaded', () => {
  const video = document.getElementById('cam');
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  
  let localStream = null;
  let audioEnabled = true;
  let videoEnabled = true;
  let aiCutActive = false;
  let scaleMode = 'cover';
  
  window.customBgImage = null;
  window.customBgVideo = null;
  window.customMaskImage = null;

  // Generare automată a celor 3 Fundaluri Muzicale Tematice la pornire
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = 720; bgCanvas.height = 1280;
  const bCtx = bgCanvas.getContext('2d');

  // Fundal 1: Club / Boxe & Lumini Roșu-Albastru
  function createMusicBg1() {
    bCtx.fillStyle = '#050510'; bCtx.fillRect(0, 0, 720, 1280);
    let grad = bCtx.createRadialGradient(360, 640, 50, 360, 640, 600);
    grad.addColorStop(0, '#ff0055'); grad.addColorStop(1, '#002244');
    bCtx.fillStyle = grad; bCtx.fillRect(0, 0, 720, 1280);
    // Efect note muzicale / cercuri
    bCtx.strokeStyle = 'rgba(255,255,255,0.15)'; bCtx.lineWidth = 4;
    bCtx.beginPath(); bCtx.arc(360, 640, 200, 0, Math.PI*2); bCtx.stroke();
    bCtx.beginPath(); bCtx.arc(360, 640, 350, 0, Math.PI*2); bCtx.stroke();
    let img = new Image(); img.src = bgCanvas.toDataURL();
    return img;
  }

  // Fundal 2: DJ Neon Electric
  function createMusicBg2() {
    bCtx.fillStyle = '#021018'; bCtx.fillRect(0, 0, 720, 1280);
    let grad = bCtx.createLinearGradient(0, 0, 720, 1280);
    grad.addColorStop(0, '#00f0ff'); grad.addColorStop(1, '#7928ca');
    bCtx.fillStyle = grad; bCtx.fillRect(0, 0, 720, 1280);
    // Linii egalizator grafic simulate
    bCtx.fillStyle = 'rgba(0,0,0,0.3)';
    for(let i=0; i<720; i+=40) {
      bCtx.fillRect(i, 900, 25, Math.sin(i)*250 + 300);
    }
    let img = new Image(); img.src = bgCanvas.toDataURL();
    return img;
  }

  // Fundal 3: Party Strobe / Auriu & Violet
  function createMusicBg3() {
    bCtx.fillStyle = '#100515'; bCtx.fillRect(0, 0, 720, 1280);
    let grad = bCtx.createRadialGradient(360, 200, 20, 360, 640, 700);
    grad.addColorStop(0, '#ffb800'); grad.addColorStop(1, '#3a0ca3');
    bCtx.fillStyle = grad; bCtx.fillRect(0, 0, 720, 1280);
    let img = new Image(); img.src = bgCanvas.toDataURL();
    return img;
  }

  // Setează din oficiu primul fundal muzical activ
  window.customBgImage = createMusicBg1();

  // Butoane selectare fundaluri muzicale
  document.getElementById('btnMusicBg1').addEventListener('click', () => {
    window.customBgVideo = null;
    window.customBgImage = createMusicBg1();
    showToast("Selectat: Fundal Club 🎵");
  });
  document.getElementById('btnMusicBg2').addEventListener('click', () => {
    window.customBgVideo = null;
    window.customBgImage = createMusicBg2();
    showToast("Selectat: Fundal DJ Neon 🎧");
  });
  document.getElementById('btnMusicBg3').addEventListener('click', () => {
    window.customBgVideo = null;
    window.customBgImage = createMusicBg3();
    showToast("Selectat: Fundal Party Strobe 🎸");
  });

  // Setări Logo salvate
  const savedLogo = localStorage.getItem('dj_logo');
  if(savedLogo) document.getElementById('logoText').value = savedLogo;
  document.getElementById('logoText').addEventListener('input', (e) => {
    localStorage.setItem('dj_logo', e.target.value);
  });

  // Inițializare Cameră & Microfon
  async function initCamera() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 720 }, height: { ideal: 1280 }, facingMode: "user" },
        audio: true
      });
      video.srcObject = localStream;
      await video.play();
      showToast("Cameră și microfon pornite!");
    } catch(err) {
      console.error(err);
      showToast("Erore acces cameră. Verifică permisiunile.");
    }
  }
  initCamera();

  // MediaPipe Selfie Segmentation (AI Cut)
  const selfieSegmentation = new SelfieSegmentation({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
  });
  selfieSegmentation.setOptions({ modelSelection: 1 });

  selfieSegmentation.onResults((results) => {
    if (!aiCutActive) return;
    drawWithSegmentation(results.segmentationMask);
  });

  // Buclă de Randare Permanentă pe Canvas (Garantează că te vezi mereu)
  function renderLoop() {
    if (video.readyState >= video.HAVE_CURRENT_DATA) {
      if(canvas.width !== video.videoWidth || canvas.height !== video.videoHeight) {
        canvas.width = video.videoWidth || 720;
        canvas.height = video.videoHeight || 1280;
      }

      if (aiCutActive) {
        selfieSegmentation.send({ image: video });
      } else {
        drawNormalFrame();
      }
    }
    requestAnimationFrame(renderLoop);
  }
  requestAnimationFrame(renderLoop);

  // Cadru Normal (Fundal + Video vizibil direct)
  function drawNormalFrame() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();

    if (videoEnabled) {
      drawImageScaled(video, canvas, scaleMode);
    }

    drawMaskAndLogo();
  }

  // Cadru cu AI Cut activ
  function drawWithSegmentation(mask) {
    ctx.save();
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // 1. Desenează fundalul
    drawBackground();

    // 2. Taie masca siluetei
    ctx.globalCompositeOperation = 'destination-in';
    ctx.drawImage(mask, 0, 0, canvas.width, canvas.height);

    // 3. Desenează video-ul tău în decupaj
    ctx.globalCompositeOperation = 'source-in';
    if (videoEnabled) {
      drawImageScaled(video, canvas, scaleMode);
    }

    ctx.restore();
    drawMaskAndLogo();
  }

  function drawBackground() {
    if (window.customBgVideo && window.customBgVideo.readyState >= window.customBgVideo.HAVE_CURRENT_DATA) {
      ctx.drawImage(window.customBgVideo, 0, 0, canvas.width, canvas.height);
    } else if (window.customBgImage) {
      ctx.drawImage(window.customBgImage, 0, 0, canvas.width, canvas.height);
    } else {
      ctx.fillStyle = '#071018';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
  }

  function drawImageScaled(img, canvas, mode) {
    let hRatio = canvas.width / img.videoWidth;
    let vRatio = canvas.height / img.videoHeight;
    let ratio = mode === 'cover' ? Math.max(hRatio, vRatio) : Math.min(hRatio, vRatio);
    let centerShiftX = (canvas.width - img.videoWidth * ratio) / 2;
    let centerShiftY = (canvas.height - img.videoHeight * ratio) / 2;
    ctx.drawImage(img, 0, 0, img.videoWidth, img.videoHeight, centerShiftX, centerShiftY, img.videoWidth * ratio, img.videoHeight * ratio);
  }

  function drawMaskAndLogo() {
    if (window.customMaskImage) {
      const mw = canvas.width * 0.4;
      const mh = mw * (window.customMaskImage.height / window.customMaskImage.width);
      const mx = (canvas.width - mw) / 2;
      const my = canvas.height * 0.25;
      ctx.drawImage(window.customMaskImage, mx, my, mw, mh);
    }

    const logoVal = document.getElementById('logoText').value || "DJCIOKOSTUDIO";
    ctx.save();
    ctx.font = "bold 24px Georgia";
    ctx.fillStyle = "#b9e4ff";
    ctx.shadowColor = "#000";
    ctx.shadowBlur = 10;
    ctx.textAlign = "right";
    ctx.fillText(logoVal, canvas.width - 25, 45);
    ctx.restore();
  }

  // Buton AI Cut ON/OFF
  const btnAiCut = document.getElementById('btnAiCut');
  btnAiCut.addEventListener('click', () => {
    aiCutActive = !aiCutActive;
    btnAiCut.textContent = aiCutActive ? "✂️ AI Cut ON" : "✂️ AI Cut OFF";
    btnAiCut.classList.toggle('on', aiCutActive);
    showToast(aiCutActive ? "AI Cut activat pe fundal!" : "AI Cut dezactivat");
  });

  // Scalare liberă
  const btnScaleToggle = document.getElementById('btnScaleToggle');
  btnScaleToggle.addEventListener('click', () => {
    scaleMode = scaleMode === 'cover' ? 'contain' : 'cover';
    btnScaleToggle.textContent = scaleMode === 'cover' ? "📐 Scalare: Cover" : "📐 Scalare: Contain";
    showToast(`Mod scalare: ${scaleMode}`);
  });

  // Audio ON/OFF
  const btnMic = document.getElementById('btnMic');
  btnMic.addEventListener('click', () => {
    if(!localStream) return;
    audioEnabled = !audioEnabled;
    localStream.getAudioTracks().forEach(track => track.enabled = audioEnabled);
    btnMic.textContent = audioEnabled ? "🎙 Audio ON" : "🔇 Audio OFF";
    btnMic.classList.toggle('on', audioEnabled);
  });

  // Video ON/OFF
  const btnVideoToggle = document.getElementById('btnVideoToggle');
  btnVideoToggle.addEventListener('click', () => {
    if(!localStream) return;
    videoEnabled = !videoEnabled;
    localStream.getVideoTracks().forEach(track => track.enabled = videoEnabled);
    btnVideoToggle.textContent = videoEnabled ? "📹 Video ON" : "📴 Video OFF";
    btnVideoToggle.classList.toggle('on', videoEnabled);
  });

  // Upload Foto
  const fileBg = document.getElementById('fileBg');
  document.getElementById('btnUploadBg').addEventListener('click', () => fileBg.click());
  fileBg.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) {
      window.customBgVideo = null;
      const reader = new FileReader();
      reader.onload = (evt) => {
        window.customBgImage = new Image();
        window.customBgImage.src = evt.target.result;
        showToast("Fundal foto încărcat!");
      };
      reader.readAsDataURL(file);
    }
  });

  // Upload Video
  const fileBgVideo = document.getElementById('fileBgVideo');
  const bgVideoElem = document.getElementById('bgVideoElem');
  document.getElementById('btnUploadBgVideo').addEventListener('click', () => fileBgVideo.click());
  fileBgVideo.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) {
      window.customBgImage = null;
      bgVideoElem.src = URL.createObjectURL(file);
      bgVideoElem.play();
      window.customBgVideo = bgVideoElem;
      showToast("Fundal video încărcat!");
    }
  });

  // Mască PNG
  const fileMask = document.getElementById('fileMask');
  document.getElementById('btnUploadMask').addEventListener('click', () => fileMask.click());
  fileMask.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if(file) {
      const reader = new FileReader();
      reader.onload = (evt) => {
        window.customMaskImage = new Image();
        window.customMaskImage.src = evt.target.result;
        showToast("Mască PNG încărcată!");
      };
      reader.readAsDataURL(file);
    }
  });

  // ON AIR Transmisie
  let isOnAir = false;
  const recBtn = document.getElementById('recBtn');
  const topLiveBadge = document.getElementById('topLiveBadge');

  recBtn.addEventListener('click', () => {
    isOnAir = !isOnAir;
    if(isOnAir) {
      recBtn.classList.add('rec');
      topLiveBadge.classList.add('active');
      showToast("Transmisie ON AIR pornită!");
    } else {
      recBtn.classList.remove('rec');
      topLiveBadge.classList.remove('active');
      showToast("Transmisie oprită.");
    }
  });
});
</script>
</body>
</html>
